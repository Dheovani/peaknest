openapi: 3.1.0
info:
  title: Fitness Platform API
  version: 1.0.0-foundation
  description: Foundation contract. Product endpoints will be added by vertical slice.
paths:
  /api/v1/health:
    get:
      summary: Check versioned API availability
      operationId: getHealth
      responses:
        "200":
          description: API is reachable
          headers:
            x-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status:
                    const: ok
                  version:
                    const: v1
