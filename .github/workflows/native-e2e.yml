name: Native E2E
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      - name: Build and test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          script: |
            CI=1 pnpm --filter @fitness/mobile exec expo start --localhost > /tmp/expo.log 2>&1 &
            cd apps/mobile
            pnpm exec expo run:android --no-bundler
            cd ../..
            curl -fsSL https://get.maestro.mobile.dev | bash
            export PATH="$PATH:$HOME/.maestro/bin"
            pnpm test:e2e:mobile
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      - name: Build and test on iOS simulator
        run: |
          device_id=$(xcrun simctl list devices available -j | jq -r '.devices[][] | select(.name | startswith("iPhone")) | .udid' | head -n 1)
          test -n "$device_id"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          CI=1 pnpm --filter @fitness/mobile exec expo start --localhost > /tmp/expo.log 2>&1 &
          cd apps/mobile
          pnpm exec expo run:ios --device "$device_id" --no-bundler
          cd ../..
          curl -fsSL https://get.maestro.mobile.dev | bash
          export PATH="$PATH:$HOME/.maestro/bin"
          pnpm test:e2e:mobile
