services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
      POSTGRES_DB: fitness
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - fitness_postgres:/var/lib/postgresql/data
volumes:
  fitness_postgres:
